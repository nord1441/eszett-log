apiVersion: apps/v1
kind: Deployment
metadata:
  name: eszett-log
  namespace: eszett-log
  labels:
    app: eszett-log
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eszett-log
  template:
    metadata:
      labels:
        app: eszett-log
    spec:
      containers:
        - name: eszett-log
          image: ghcr.io/OWNER/eszett-log:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eszett-log
                  key: JWT_SECRET
          volumeMounts:
            - name: posts
              mountPath: /app/posts
            - name: data
              mountPath: /app/data
            - name: uploads
              mountPath: /app/uploads
          livenessProbe:
            httpGet:
              path: /api/settings
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/settings
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: posts
          persistentVolumeClaim:
            claimName: eszett-log-posts
        - name: data
          persistentVolumeClaim:
            claimName: eszett-log-data
        - name: uploads
          persistentVolumeClaim:
            claimName: eszett-log-uploads
