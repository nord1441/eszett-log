apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "eszett-log.fullname" . }}-posts
  labels:
    {{- include "eszett-log.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.posts.storageClass }}
  storageClassName: {{ .Values.persistence.posts.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.posts.size }}
---
